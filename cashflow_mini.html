<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Cashflow Mini</title>
<style>
:root{
  --bg:#0B0F1A;--surface:#131B2C;--surface2:#1A2438;--border:#243149;
  --text:#E5EAF3;--muted:#6B7C99;
  --accent:#00D9A0;--info:#4A90FF;--warn:#FF6B6B;--gold:#FFB84D;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:32px}
.container{max-width:640px;margin:0 auto;padding:20px 16px}

.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.title{font-size:22px;font-weight:800;letter-spacing:-0.5px}
.subtitle{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.6px;margin-top:2px}
.hdr-pill{background:rgba(0,217,160,.12);border:1px solid rgba(0,217,160,.3);border-radius:20px;padding:6px 14px;text-align:right}
.hdr-pill.neg{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.3)}
.hdr-pill-label{font-size:10px;color:var(--muted)}
.hdr-pill-val{font-size:15px;font-weight:700;color:var(--accent)}
.hdr-pill.neg .hdr-pill-val{color:var(--warn)}

.month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.month-btn{background:var(--surface2);border:0;color:var(--text);width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer}
.month-name{font-size:16px;font-weight:700}
.month-tag{font-size:10px;color:var(--muted);text-align:center}

.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:11px;border:0;border-radius:11px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--muted)}
.tab.active{background:var(--accent);color:var(--bg)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.card-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;font-weight:700}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-head .card-title{margin-bottom:0}
.card-total{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

/* edit rows */
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.row:last-of-type{border-bottom:0}
.row .name{flex:1;background:transparent;border:0;color:var(--text);font-size:13px;padding:6px 0;outline:none;min-width:0}
.row .name:focus{border-bottom:1px solid var(--accent)}
.row .amt{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:120px;padding:7px 9px;border-radius:8px;font-size:13px;text-align:right;outline:none;font-variant-numeric:tabular-nums}
.row .amt:focus{border-color:var(--accent)}
.row .cat{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 6px;border-radius:8px;font-size:12px;outline:none;max-width:115px}
.row.exp{flex-direction:column;align-items:stretch;gap:6px;padding:10px 0}
.exp-line{display:flex;align-items:center;gap:6px}
.exp-line.tags select{flex:1;min-width:0;max-width:none;font-size:11px;padding:6px 4px}
.del{background:0;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 6px;border-radius:6px}
.del:hover{color:var(--warn);background:rgba(255,107,107,.1)}
.empty{font-size:12px;color:var(--muted);padding:12px 0;text-align:center}

.add-btn{width:100%;background:0;border:1px dashed var(--border);color:var(--muted);padding:10px;border-radius:10px;font-family:inherit;font-size:12px;cursor:pointer;margin-top:8px}
.add-btn:hover{color:var(--accent);border-color:var(--accent)}

/* summary */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px 10px;text-align:center}
.metric-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:600}
.metric-val{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.metric.income .metric-val{color:var(--accent)}
.metric.spent .metric-val{color:var(--info)}
.metric.surplus.pos .metric-val{color:var(--accent)}
.metric.surplus.neg .metric-val{color:var(--warn)}
.metric-sub{font-size:10px;font-weight:700;margin-top:5px;padding:2px 8px;border-radius:10px;display:inline-block}
.up{background:rgba(0,217,160,.15);color:var(--accent)}
.down{background:rgba(255,107,107,.15);color:var(--warn)}
.flat{background:rgba(107,124,153,.15);color:var(--muted)}

.bar-row{margin-bottom:11px}
.bar-row:last-child{margin-bottom:0}
.bar-info{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.bar-info .left{display:flex;gap:6px;align-items:center;min-width:0}
.bar-info .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-info .right{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.bar-track{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .25s}

.list-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.list-row:last-child{border-bottom:0}
.list-row .left{display:flex;gap:8px;align-items:center;min-width:0;flex:1;overflow:hidden}
.list-row .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .amt{font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;margin-left:8px}
.rank{width:22px;height:22px;border-radius:6px;background:var(--surface2);color:var(--gold);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.history-row{cursor:pointer}
.history-row:hover{background:var(--surface2);margin:0 -14px;padding-left:14px;padding-right:14px;border-radius:6px}

.actions{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:10px;border:0;border-radius:10px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--bg)}
.btn.secondary{background:var(--surface2);color:var(--text)}
.btn.danger{background:rgba(255,107,107,.12);color:var(--warn)}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--bg);padding:9px 18px;border-radius:20px;font-size:13px;font-weight:700;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.save-dot{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);margin-left:8px;font-weight:600}
.save-dot.saving{color:var(--gold)}
.save-dot.saved{color:var(--accent)}
.save-dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="container">
  <div class="header">
    <div>
      <div class="title">💰 Cashflow Mini</div>
      <div class="subtitle">Monthly Tracker <span class="save-dot saved" id="save-dot">Saved</span></div>
    </div>
    <div class="hdr-pill" id="hdr-pill">
      <div class="hdr-pill-label">Surplus</div>
      <div class="hdr-pill-val" id="hdr-surplus">—</div>
    </div>
  </div>

  <div class="month-nav">
    <button class="month-btn" onclick="changeMonth(-1)">‹</button>
    <div>
      <div class="month-name" id="month-display">—</div>
      <div class="month-tag" id="month-tag"></div>
    </div>
    <button class="month-btn" onclick="changeMonth(1)">›</button>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-edit" onclick="showTab('edit')">✏️ Edit</button>
    <button class="tab" id="tab-summary" onclick="showTab('summary')">📊 Summary</button>
  </div>

  <!-- EDIT VIEW -->
  <div id="view-edit">
    <div class="card">
      <div class="card-head">
        <div class="card-title">💵 Income</div>
        <div class="card-total" id="edit-income-total" style="color:var(--accent)">—</div>
      </div>
      <div id="income-list"></div>
      <button class="add-btn" onclick="addIncome()">+ Add income source</button>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="card-title">💸 Expenses</div>
        <div class="card-total" id="edit-expense-total" style="color:var(--info)">—</div>
      </div>
      <div id="expense-list"></div>
      <button class="add-btn" onclick="addExpense()">+ Add expense</button>
    </div>

    <div class="card">
      <div class="card-title">⚙️ Tools</div>
      <div class="actions">
        <button class="btn secondary" onclick="copyFromPrev()">📋 Copy from prev</button>
        <button class="btn secondary" onclick="seedCurrentMonth(false)">✨ Load defaults</button>
      </div>
      <div class="actions">
        <button class="btn secondary" onclick="exportData()">📤 Export</button>
        <button class="btn secondary" onclick="document.getElementById('import').click()">📥 Import</button>
        <input type="file" id="import" accept=".json" style="display:none" onchange="importData(event)"/>
      </div>
      <div class="actions">
        <button class="btn danger" onclick="clearMonth()">🗑️ Clear this month</button>
      </div>
    </div>
  </div>

  <!-- SUMMARY VIEW -->
  <div id="view-summary" style="display:none">
    <div class="metrics">
      <div class="metric income">
        <div class="metric-label">Income</div>
        <div class="metric-val" id="m-income">—</div>
        <div id="m-income-delta"></div>
      </div>
      <div class="metric spent">
        <div class="metric-label">Spent</div>
        <div class="metric-val" id="m-spent">—</div>
        <div id="m-spent-delta"></div>
      </div>
      <div class="metric surplus" id="m-surplus-card">
        <div class="metric-label">Surplus</div>
        <div class="metric-val" id="m-surplus">—</div>
        <div id="m-surplus-delta"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🏦 Transfer Plan (by Bank)</div>
      <div id="bank-bars"></div>
    </div>

    <div class="card">
      <div class="card-title">👤 By PIC</div>
      <div id="pic-bars"></div>
    </div>

    <div class="card">
      <div class="card-title">📊 Spending by Category</div>
      <div id="cat-bars"></div>
    </div>

    <div class="card">
      <div class="card-title">🔥 Top 5 Expenses</div>
      <div id="top-list"></div>
    </div>

    <div class="card">
      <div class="card-title">📅 All Months</div>
      <div id="history"></div>
    </div>

    <div class="card">
      <div class="card-title">📈 All-Time Stats</div>
      <div id="alltime"></div>
    </div>
  </div>
</div>

<script>
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTHS_SHORT=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const CATEGORIES={
  household:{label:"Household",icon:"🏠",color:"#6366F1"},
  utilities:{label:"Utilities",icon:"💡",color:"#60A5FA"},
  mortgage:{label:"Mortgage",icon:"🏗️",color:"#F59E0B"},
  creditcard:{label:"Credit Card",icon:"💳",color:"#FB923C"},
  savings:{label:"Savings",icon:"🐷",color:"#00E5A0"},
  family:{label:"Family",icon:"👨‍👩‍👧",color:"#A78BFA"},
  pet:{label:"Pet",icon:"🐾",color:"#34D399"},
  health:{label:"Health",icon:"⚕️",color:"#F472B6"},
  transport:{label:"Transport",icon:"🚗",color:"#FBBF24"},
  food:{label:"Food",icon:"🍔",color:"#EF4444"},
  fun:{label:"Fun",icon:"🎉",color:"#EC4899"},
  other:{label:"Other",icon:"📦",color:"#94A3B8"},
};
const STORAGE_KEY='cashflow_mini_v1';

// Banks = transfer destinations
const BANKS={
  jago_egi:    {label:"Jago - Egi",     short:"Jago",    icon:"🐉", color:"#E84393"},
  permata_egi: {label:"Permata - Egi",  short:"Permata", icon:"🏦", color:"#E8A020"},
  mandiri_egi: {label:"Mandiri - Egi",  short:"Mandiri", icon:"🏛️", color:"#FB923C"},
  jago_mila:   {label:"Jago - Mila",    short:"Jago",    icon:"🐉", color:"#F472B6"},
  mandiri_mila:{label:"Mandiri - Mila", short:"Mandiri", icon:"🏛️", color:"#A78BFA"},
  bsi_ibu:     {label:"BSI - Ibu",      short:"BSI",     icon:"☪️", color:"#00B050"},
};
// PIC = person responsible
const PICS={
  egi: {label:"Egi",  icon:"👤", color:"#4A90FF"},
  mila:{label:"Mila", icon:"👤", color:"#F472B6"},
};

// Seed data ported from cashflow_egi.html (DEFAULT_INC + DEFAULT_ACCOUNTS).
// Categories mapped to mini's category set; bank + pic added per item.
const DEFAULT_INCOME=[
  {name:"Gaji Utama",amount:45500000},
];
const DEFAULT_EXPENSES=[
  {name:"House Rent",amount:2000000,cat:"mortgage",bank:"permata_egi",pic:"egi"},
  {name:"Credit Card",amount:9500000,cat:"creditcard",bank:"permata_egi",pic:"egi"},
  {name:"Kontrakan",amount:2000000,cat:"mortgage",bank:"jago_egi",pic:"egi"},
  {name:"Uang Weekend",amount:1600000,cat:"household",bank:"jago_egi",pic:"egi"},
  {name:"Servis Mobil & Motor",amount:500000,cat:"transport",bank:"jago_egi",pic:"egi"},
  {name:"Cash Darurat",amount:500000,cat:"savings",bank:"jago_egi",pic:"egi"},
  {name:"Pegangan Egi",amount:500000,cat:"other",bank:"jago_egi",pic:"egi"},
  {name:"Kurban",amount:330000,cat:"family",bank:"jago_egi",pic:"egi"},
  {name:"STNK Mobil",amount:300000,cat:"transport",bank:"jago_egi",pic:"egi"},
  {name:"Belanja Baju",amount:400000,cat:"household",bank:"jago_egi",pic:"egi"},
  {name:"Snack",amount:400000,cat:"food",bank:"jago_egi",pic:"egi"},
  {name:"Camilan Egi",amount:400000,cat:"food",bank:"jago_egi",pic:"egi"},
  {name:"Pulsa Egi",amount:200000,cat:"utilities",bank:"jago_egi",pic:"egi"},
  {name:"Bensin Mobil",amount:800000,cat:"transport",bank:"jago_egi",pic:"egi"},
  {name:"Bensin Motor",amount:150000,cat:"transport",bank:"jago_egi",pic:"egi"},
  {name:"Jumat Berkah",amount:155000,cat:"family",bank:"jago_egi",pic:"egi"},
  {name:"Chosen & Chika",amount:1200000,cat:"pet",bank:"jago_egi",pic:"egi"},
  {name:"Pregnancy Control",amount:2500000,cat:"health",bank:"jago_egi",pic:"egi"},
  {name:"Nafkah Mila",amount:3000000,cat:"family",bank:"mandiri_mila",pic:"mila"},
  {name:"Paylater Shopee",amount:1500000,cat:"creditcard",bank:"mandiri_mila",pic:"mila"},
  {name:"iCloud",amount:150000,cat:"utilities",bank:"mandiri_mila",pic:"mila"},
  {name:"Pulsa Mila",amount:100000,cat:"utilities",bank:"mandiri_mila",pic:"mila"},
  {name:"Dr Zlim",amount:300000,cat:"health",bank:"mandiri_mila",pic:"mila"},
  {name:"Makan & Sayur",amount:1800000,cat:"food",bank:"mandiri_egi",pic:"egi"},
  {name:"Listrik",amount:600000,cat:"utilities",bank:"mandiri_egi",pic:"egi"},
  {name:"Wifi",amount:280000,cat:"utilities",bank:"mandiri_egi",pic:"egi"},
  {name:"Aqua",amount:160000,cat:"utilities",bank:"mandiri_egi",pic:"egi"},
  {name:"Gas",amount:75000,cat:"utilities",bank:"mandiri_egi",pic:"egi"},
  {name:"Sabun/Shampoo/Deterjen",amount:50000,cat:"household",bank:"mandiri_egi",pic:"egi"},
  {name:"Netflix",amount:35000,cat:"fun",bank:"mandiri_egi",pic:"egi"},
  {name:"IPL",amount:60000,cat:"household",bank:"mandiri_egi",pic:"egi"},
  {name:"Other Household",amount:450000,cat:"household",bank:"mandiri_egi",pic:"egi"},
  {name:"Transfer to Ibu",amount:3500000,cat:"family",bank:"bsi_ibu",pic:"egi"},
  {name:"Tokopedia",amount:2100000,cat:"household",bank:"mandiri_egi",pic:"egi"},
  {name:"Car Payment",amount:4700000,cat:"mortgage",bank:"mandiri_egi",pic:"egi"},
];
// Map egi-format category keys → mini-format category keys
const CAT_REMAP={wifey:'family',future:'savings'};
// Map egi account.id → bank/pic for import
const EGI_ACCOUNT_MAP={
  permata: {bank:'permata_egi',  pic:'egi'},
  jago:    {bank:'jago_egi',     pic:'egi'},
  miyut:   {bank:'mandiri_mila', pic:'mila'},
  rt:      {bank:'mandiri_egi',  pic:'egi'},
  ibu:     {bank:'bsi_ibu',      pic:'egi'},
  mandiri: {bank:'mandiri_egi',  pic:'egi'},
};

let state={data:{},curYear:new Date().getFullYear(),curMonth:new Date().getMonth(),tab:'edit'};

function key(y,m){return `${y}-${String(m+1).padStart(2,'0')}`}
function curKey(){return key(state.curYear,state.curMonth)}
function prevKey(){let y=state.curYear,m=state.curMonth-1;if(m<0){m=11;y--}return key(y,m)}
function getMonth(k){
  k=k||curKey();
  if(!state.data[k])state.data[k]={income:[],expenses:[]};
  return state.data[k];
}
function totalInc(md){return md.income.reduce((s,i)=>s+(+i.amount||0),0)}
function totalExp(md){return md.expenses.reduce((s,i)=>s+(+i.amount||0),0)}

function fmt(n){return'Rp '+Number(Math.round(n)).toLocaleString('id-ID')}
function fmtShort(n){
  const a=Math.abs(n);const sign=n<0?'-':'';
  if(a>=1e9)return sign+'Rp'+(a/1e9).toFixed(1)+'B';
  if(a>=1e6)return sign+'Rp'+(a/1e6).toFixed(1)+'M';
  if(a>=1e3)return sign+'Rp'+(a/1e3).toFixed(0)+'K';
  return sign+'Rp'+a;
}

let _saveTimer=null;
function flashSave(){
  const d=document.getElementById('save-dot');if(!d)return;
  d.className='save-dot saving';d.textContent='Saving…';
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{d.className='save-dot saved';d.textContent='Saved'},350);
}
function save(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state.data));flashSave()}
  catch(e){
    const d=document.getElementById('save-dot');
    if(d){d.className='save-dot';d.style.color='var(--warn)';d.textContent='Save failed'}
  }
}
function load(){try{const r=localStorage.getItem(STORAGE_KEY);if(r)state.data=JSON.parse(r)}catch(e){}}

function seedCurrentMonth(force){
  const k=curKey();
  if(!force&&state.data[k]&&(state.data[k].income.length||state.data[k].expenses.length)){
    if(!confirm('This month already has data. Replace it with defaults?'))return;
  }
  state.data[k]={
    income:DEFAULT_INCOME.map(i=>({id:newId(),...i})),
    expenses:DEFAULT_EXPENSES.map(i=>({id:newId(),...i})),
  };
  save();render();toast('Defaults loaded ✓');
}

function isEgiBackup(d){
  if(!d||typeof d!=='object')return false;
  const k=Object.keys(d);if(!k.length)return false;
  const sample=d[k[0]];
  return sample&&(Array.isArray(sample.accounts)||Array.isArray(sample.inc)||Array.isArray(sample.incomeSources));
}
function convertEgiBackup(eg){
  const out={};
  for(const [k,md] of Object.entries(eg)){
    let nk=k;
    if(/^cf_\d{4}_\d{2}$/.test(k)){const p=k.split('_');nk=`${p[1]}-${p[2]}`}
    else if(/^\d{4}-\d{2}$/.test(k))nk=k;
    const incSrc=md.inc||md.incomeSources||(md.income?[{name:'Income',amount:md.income}]:[]);
    const income=incSrc.map(i=>({id:newId(),name:i.name||'',amount:+i.amount||0}));
    const expenses=[];
    (md.accounts||[]).forEach(a=>{
      const acc=EGI_ACCOUNT_MAP[a.id]||{bank:'',pic:''};
      (a.items||[]).forEach(i=>{
        let cat=i.cat||'other';
        cat=CAT_REMAP[cat]||cat;
        if(!CATEGORIES[cat])cat='other';
        expenses.push({id:newId(),name:i.name||'',amount:+i.amount||0,cat,bank:acc.bank,pic:acc.pic});
      });
    });
    out[nk]={income,expenses};
  }
  return out;
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

function changeMonth(d){
  state.curMonth+=d;
  if(state.curMonth>11){state.curMonth=0;state.curYear++}
  if(state.curMonth<0){state.curMonth=11;state.curYear--}
  render();
}

function showTab(t){
  state.tab=t;
  document.getElementById('view-edit').style.display=t==='edit'?'block':'none';
  document.getElementById('view-summary').style.display=t==='summary'?'block':'none';
  document.getElementById('tab-edit').className='tab'+(t==='edit'?' active':'');
  document.getElementById('tab-summary').className='tab'+(t==='summary'?' active':'');
  if(t==='summary')renderSummary();
}

function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function addIncome(){
  getMonth().income.push({id:newId(),name:'',amount:0});
  save();renderEdit();
}
function addExpense(){
  getMonth().expenses.push({id:newId(),name:'',amount:0,cat:'other',bank:'',pic:''});
  save();renderEdit();
}
function delItem(arr,id){
  const md=getMonth();
  md[arr]=md[arr].filter(x=>x.id!==id);
  save();render();
  toast('Deleted');
}
function updItem(arr,id,field,val){
  const md=getMonth();
  const it=md[arr].find(x=>x.id===id);
  if(!it)return;
  if(field==='amount')val=+val||0;
  it[field]=val;
  save();updateHeader();updateEditTotals();
}

function copyFromPrev(){
  const p=state.data[prevKey()];
  if(!p){toast('No previous month');return}
  if(!confirm('Copy income & expenses from previous month? This replaces current month.'))return;
  state.data[curKey()]={
    income:p.income.map(i=>({...i,id:newId()})),
    expenses:p.expenses.map(i=>({...i,id:newId()})),
  };
  save();render();toast('Copied ✓');
}
function clearMonth(){
  if(!confirm('Clear all data for this month?'))return;
  delete state.data[curKey()];
  save();render();toast('Cleared');
}

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function renderEdit(){
  const md=getMonth();
  const incList=document.getElementById('income-list');
  incList.innerHTML=md.income.length?md.income.map(i=>`
    <div class="row">
      <input class="name" type="text" placeholder="e.g. Salary, Bonus"
             value="${escapeHtml(i.name)}"
             oninput="updItem('income','${i.id}','name',this.value)"/>
      <input class="amt" type="number" inputmode="numeric" placeholder="0"
             value="${i.amount||''}"
             oninput="updItem('income','${i.id}','amount',this.value)"/>
      <button class="del" onclick="delItem('income','${i.id}')">✕</button>
    </div>
  `).join(''):'<div class="empty">No income yet. Add one below.</div>';

  const expList=document.getElementById('expense-list');
  expList.innerHTML=md.expenses.length?md.expenses.map(i=>`
    <div class="row exp">
      <div class="exp-line">
        <input class="name" type="text" placeholder="e.g. Rent, Wifi"
               value="${escapeHtml(i.name)}"
               oninput="updItem('expenses','${i.id}','name',this.value)"/>
        <input class="amt" type="number" inputmode="numeric" placeholder="0"
               value="${i.amount||''}"
               oninput="updItem('expenses','${i.id}','amount',this.value)"/>
        <button class="del" onclick="delItem('expenses','${i.id}')">✕</button>
      </div>
      <div class="exp-line tags">
        <select onchange="updItem('expenses','${i.id}','cat',this.value)">
          ${Object.entries(CATEGORIES).map(([k,c])=>`<option value="${k}" ${i.cat===k?'selected':''}>${c.icon} ${c.label}</option>`).join('')}
        </select>
        <select onchange="updItem('expenses','${i.id}','bank',this.value)">
          <option value="" ${!i.bank?'selected':''}>🏦 Bank…</option>
          ${Object.entries(BANKS).map(([k,b])=>`<option value="${k}" ${i.bank===k?'selected':''}>${b.icon} ${b.label}</option>`).join('')}
        </select>
        <select onchange="updItem('expenses','${i.id}','pic',this.value)">
          <option value="" ${!i.pic?'selected':''}>👤 PIC…</option>
          ${Object.entries(PICS).map(([k,p])=>`<option value="${k}" ${i.pic===k?'selected':''}>${p.icon} ${p.label}</option>`).join('')}
        </select>
      </div>
    </div>
  `).join(''):'<div class="empty">No expenses yet. Add one below.</div>';

  updateEditTotals();
}

function updateEditTotals(){
  const md=getMonth();
  document.getElementById('edit-income-total').textContent=fmtShort(totalInc(md));
  document.getElementById('edit-expense-total').textContent=fmtShort(totalExp(md));
}

function updateHeader(){
  const md=getMonth();
  const sur=totalInc(md)-totalExp(md);
  const pill=document.getElementById('hdr-pill');
  pill.classList.toggle('neg',sur<0);
  document.getElementById('hdr-surplus').textContent=fmtShort(sur);
  document.getElementById('month-display').textContent=`${MONTHS[state.curMonth]} ${state.curYear}`;
  const today=new Date();
  const isCur=today.getFullYear()===state.curYear&&today.getMonth()===state.curMonth;
  document.getElementById('month-tag').textContent=isCur?'Current month':'';
}

function deltaPill(cur,prev,inverted){
  if(prev===null||prev===undefined||prev===0)return'';
  const diff=cur-prev,pct=diff/Math.abs(prev)*100;
  const isUp=diff>0,isDown=diff<0;
  const good=inverted?isDown:isUp;
  const bad=inverted?isUp:isDown;
  const cls=good?'up':bad?'down':'flat';
  const arrow=isUp?'▲':isDown?'▼':'·';
  const sign=diff>=0?'+':'';
  return `<div class="metric-sub ${cls}">${arrow} ${Math.abs(pct).toFixed(0)}% (${sign}${fmtShort(diff)})</div>`;
}

function renderSummary(){
  const md=getMonth();
  const inc=totalInc(md),spent=totalExp(md),sur=inc-spent;
  const prev=state.data[prevKey()];
  const pInc=prev?totalInc(prev):0,pExp=prev?totalExp(prev):0,pSur=pInc-pExp;

  document.getElementById('m-income').textContent=fmtShort(inc);
  document.getElementById('m-spent').textContent=fmtShort(spent);
  document.getElementById('m-surplus').textContent=fmtShort(sur);
  document.getElementById('m-surplus-card').className='metric surplus '+(sur>=0?'pos':'neg');
  document.getElementById('m-income-delta').innerHTML=prev?deltaPill(inc,pInc,false):'';
  document.getElementById('m-spent-delta').innerHTML=prev?deltaPill(spent,pExp,true):'';
  document.getElementById('m-surplus-delta').innerHTML=prev?deltaPill(sur,pSur,false):'';

  // By Bank
  const byBank={},bankUntagged=md.expenses.filter(e=>!e.bank&&+e.amount>0);
  md.expenses.forEach(e=>{if(e.bank)byBank[e.bank]=(byBank[e.bank]||0)+(+e.amount||0)});
  const bankEntries=Object.entries(byBank).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const bankTotal=bankEntries.reduce((s,[,v])=>s+v,0)||1;
  const bankEl=document.getElementById('bank-bars');
  bankEl.innerHTML=(bankEntries.length?bankEntries.map(([k,v])=>{
    const b=BANKS[k]||{label:k,color:'#94A3B8',icon:'🏦'};
    const pct=v/bankTotal*100;
    return `
      <div class="bar-row">
        <div class="bar-info">
          <div class="left"><span>${b.icon}</span><span class="lbl">${b.label}</span></div>
          <div class="right">${fmtShort(v)} · ${pct.toFixed(1)}%</div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${b.color}"></div></div>
      </div>
    `;
  }).join(''):'<div class="empty">No banked expenses yet.</div>')+
  (bankUntagged.length?`<div style="font-size:11px;color:var(--warn);margin-top:8px">⚠️ ${bankUntagged.length} expense${bankUntagged.length>1?'s':''} without a bank · ${fmtShort(bankUntagged.reduce((s,e)=>s+(+e.amount||0),0))}</div>`:'');

  // By PIC
  const byPic={},picUntagged=md.expenses.filter(e=>!e.pic&&+e.amount>0);
  md.expenses.forEach(e=>{if(e.pic)byPic[e.pic]=(byPic[e.pic]||0)+(+e.amount||0)});
  const picEntries=Object.entries(byPic).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const picTotal=picEntries.reduce((s,[,v])=>s+v,0)||1;
  const picEl=document.getElementById('pic-bars');
  picEl.innerHTML=(picEntries.length?picEntries.map(([k,v])=>{
    const p=PICS[k]||{label:k,color:'#94A3B8',icon:'👤'};
    const pct=v/picTotal*100;
    return `
      <div class="bar-row">
        <div class="bar-info">
          <div class="left"><span>${p.icon}</span><span class="lbl">${p.label}</span></div>
          <div class="right">${fmtShort(v)} · ${pct.toFixed(1)}%</div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${p.color}"></div></div>
      </div>
    `;
  }).join(''):'<div class="empty">No PIC-tagged expenses yet.</div>')+
  (picUntagged.length?`<div style="font-size:11px;color:var(--warn);margin-top:8px">⚠️ ${picUntagged.length} expense${picUntagged.length>1?'s':''} without a PIC · ${fmtShort(picUntagged.reduce((s,e)=>s+(+e.amount||0),0))}</div>`:'');

  // Categories
  const byCat={};
  md.expenses.forEach(e=>{byCat[e.cat]=(byCat[e.cat]||0)+(+e.amount||0)});
  const entries=Object.entries(byCat).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const total=spent||1;
  const cats=document.getElementById('cat-bars');
  cats.innerHTML=entries.length?entries.map(([k,v])=>{
    const c=CATEGORIES[k]||CATEGORIES.other;
    const pct=v/total*100;
    return `
      <div class="bar-row">
        <div class="bar-info">
          <div class="left"><span>${c.icon}</span><span class="lbl">${c.label}</span></div>
          <div class="right">${fmtShort(v)} · ${pct.toFixed(1)}%</div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${c.color}"></div></div>
      </div>
    `;
  }).join(''):'<div class="empty">No expenses to chart.</div>';

  // Top 5
  const top=[...md.expenses].filter(e=>+e.amount>0).sort((a,b)=>(+b.amount)-(+a.amount)).slice(0,5);
  document.getElementById('top-list').innerHTML=top.length?top.map((e,idx)=>{
    const c=CATEGORIES[e.cat]||CATEGORIES.other;
    return `
      <div class="list-row">
        <div class="left">
          <div class="rank">${idx+1}</div>
          <span>${c.icon}</span>
          <span class="lbl">${escapeHtml(e.name)||'(unnamed)'}</span>
        </div>
        <div class="amt">${fmtShort(+e.amount)}</div>
      </div>
    `;
  }).join(''):'<div class="empty">No expenses yet.</div>';

  // History
  const keys=Object.keys(state.data).sort().reverse();
  document.getElementById('history').innerHTML=keys.length?keys.map(k=>{
    const m=state.data[k];
    const i=totalInc(m),e=totalExp(m),s=i-e;
    const [y,mo]=k.split('-');
    const isActive=k===curKey();
    return `
      <div class="list-row history-row" onclick="goToMonth(${+y},${+mo-1})">
        <div class="left">
          <span class="lbl" style="${isActive?'color:var(--accent);font-weight:700':''}">${MONTHS_SHORT[+mo-1]} ${y}${isActive?' ✓':''}</span>
        </div>
        <div style="display:flex;gap:10px;align-items:center;font-size:11px;color:var(--muted)">
          <span>in ${fmtShort(i)}</span>
          <span>out ${fmtShort(e)}</span>
          <span class="amt" style="color:${s>=0?'var(--accent)':'var(--warn)'}">${fmtShort(s)}</span>
        </div>
      </div>
    `;
  }).join(''):'<div class="empty">No history yet.</div>';

  // All-time
  const months=Object.values(state.data);
  const totSur=months.reduce((s,m)=>s+totalInc(m)-totalExp(m),0);
  const avg=months.length?totSur/months.length:0;
  const totIn=months.reduce((s,m)=>s+totalInc(m),0);
  const totOut=months.reduce((s,m)=>s+totalExp(m),0);
  document.getElementById('alltime').innerHTML=`
    <div class="list-row"><div class="left"><span class="lbl">Months tracked</span></div><div class="amt" style="color:var(--info)">${months.length}</div></div>
    <div class="list-row"><div class="left"><span class="lbl">Total income</span></div><div class="amt" style="color:var(--accent)">${fmtShort(totIn)}</div></div>
    <div class="list-row"><div class="left"><span class="lbl">Total spent</span></div><div class="amt" style="color:var(--info)">${fmtShort(totOut)}</div></div>
    <div class="list-row"><div class="left"><span class="lbl">Avg surplus / month</span></div><div class="amt" style="color:${avg>=0?'var(--accent)':'var(--warn)'}">${fmtShort(avg)}</div></div>
    <div class="list-row"><div class="left"><span class="lbl">Total saved</span></div><div class="amt" style="color:${totSur>=0?'var(--gold)':'var(--warn)'}">${fmtShort(totSur)}</div></div>
  `;
}

function goToMonth(y,m){state.curYear=y;state.curMonth=m;render()}

function exportData(){
  const blob=new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`cashflow_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast('Exported ✓');
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(typeof d!=='object'||Array.isArray(d))throw 0;
      const isEgi=isEgiBackup(d);
      const msg=isEgi
        ?'Detected backup from cashflow_egi.html. Import & convert? (replaces current data)'
        :'Replace all current data with imported file?';
      if(!confirm(msg))return;
      state.data=isEgi?convertEgiBackup(d):d;
      save();render();toast(isEgi?'Imported (egi format) ✓':'Imported ✓');
    }catch(err){alert('Invalid file format')}
  };
  r.readAsText(f);
  e.target.value='';
}

function render(){
  updateHeader();
  renderEdit();
  if(state.tab==='summary')renderSummary();
}

load();
// First-time bootstrap: if storage is completely empty, seed current month with Egi defaults
if(!Object.keys(state.data).length){
  state.data[curKey()]={
    income:DEFAULT_INCOME.map(i=>({id:newId(),...i})),
    expenses:DEFAULT_EXPENSES.map(i=>({id:newId(),...i})),
  };
  save();
}
render();
</script>
