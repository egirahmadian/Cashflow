<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Project Pilot — Properties & Investors</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#070B14;--surface:#0F1623;--surface2:#162032;--border:#1E2D45;
  --text:#E2EAF4;--muted:#5A7192;--accent:#00E5A0;--accent2:#3B82F6;
  --warn:#F87171;--gold:#FBBF24;--purple:#A78BFA;--pink:#F472B6;--cyan:#22D3EE
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;padding-bottom:60px}
.mono{font-family:'JetBrains Mono',monospace}

/* HEADER */
.header{background:linear-gradient(180deg,#0F1E35 0%,var(--bg) 100%);padding:36px 20px 18px;border-bottom:1px solid var(--border)}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.project-block{flex:1;min-width:0}
.project-label{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.project-name{font-size:22px;font-weight:800;cursor:pointer;border-bottom:1px dashed transparent}
.project-name:active{border-bottom-color:var(--border)}
.total-pill{background:rgba(0,229,160,.12);border:1px solid rgba(0,229,160,.3);border-radius:14px;padding:8px 14px;text-align:right;flex-shrink:0}
.total-label{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.total-val{font-size:18px;font-weight:800;color:var(--accent);font-family:'JetBrains Mono',monospace;margin-top:2px}

/* CLUSTER TABS */
.cluster-tabs{display:flex;gap:8px;padding:14px 20px 0;overflow-x:auto;scrollbar-width:none}
.cluster-tabs::-webkit-scrollbar{display:none}
.cl-tab{flex-shrink:0;padding:10px 16px;border:1px solid var(--border);background:var(--surface);color:var(--muted);
  border-radius:12px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;
  transition:all .2s}
.cl-tab.active{background:var(--accent);color:#070B14;border-color:var(--accent)}
.cl-tab .cl-count{font-size:10px;font-weight:700;background:rgba(0,0,0,.15);padding:2px 6px;border-radius:8px}
.cl-tab.active .cl-count{background:rgba(7,11,20,.18)}
.cl-tab.add{background:transparent;border-style:dashed}

/* SECTION */
.section{padding:14px 20px 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.card-title{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center}

/* CLUSTER STATS */
.cluster-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center}
.stat-label{font-size:10px;color:var(--muted);margin-bottom:4px;font-weight:500;letter-spacing:1px;text-transform:uppercase}
.stat-val{font-size:16px;font-weight:800;font-family:'JetBrains Mono',monospace}
.stat-val.accent{color:var(--accent)}
.stat-val.gold{color:var(--gold)}

/* VILLA ROWS */
.villa-row{display:flex;align-items:center;padding:11px 12px;border-bottom:1px solid #0A0F1A;gap:10px}
.villa-row:last-of-type{border-bottom:none}
.villa-num{width:26px;height:26px;border-radius:8px;background:var(--surface2);color:var(--muted);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.villa-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.villa-name{font-size:13px;font-weight:600;cursor:pointer;border-bottom:1px dashed transparent}
.villa-name:active{border-bottom-color:var(--border)}
.villa-investor-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:2px 8px;border-radius:8px;font-weight:700;cursor:pointer;border:1px solid transparent;align-self:flex-start;max-width:100%}
.villa-investor-tag .vit-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.villa-investor-tag.empty{background:var(--surface2);color:var(--muted)}
.villa-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.villa-price{font-size:13px;font-weight:700;cursor:pointer;border-bottom:1px dashed var(--border);font-family:'JetBrains Mono',monospace}
.villa-price:active{color:var(--accent)}
.del-btn{background:none;border:none;color:var(--muted);font-size:14px;padding:4px 6px;cursor:pointer;flex-shrink:0}
.del-btn:active{color:var(--warn)}

/* ADD ROW */
.add-row{padding:10px 12px}
.add-toggle{width:100%;background:none;border:1px dashed var(--border);color:var(--muted);padding:10px;border-radius:10px;font-family:inherit;font-size:12px;cursor:pointer}
.add-form{display:flex;flex-direction:column;gap:8px}
.add-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:10px;font-family:inherit;font-size:13px;outline:none}
.add-input:focus{border-color:var(--accent)}
.add-row-inline{display:flex;gap:8px}
.add-submit{background:var(--accent);color:#070B14;border:none;padding:10px 18px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.add-cancel{background:var(--surface2);border:none;color:var(--muted);padding:10px 14px;border-radius:10px;cursor:pointer;font-size:13px;font-family:inherit}

/* INVESTOR / POKEMON CARDS */
.investor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.poke-card{
  position:relative;border-radius:18px;padding:3px;
  background:linear-gradient(135deg,var(--c1,#3B82F6) 0%,var(--c2,#A78BFA) 50%,var(--c1,#3B82F6) 100%);
  box-shadow:0 6px 22px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.04) inset;
  transition:transform .15s ease;
  cursor:pointer;
  overflow:hidden;
}
.poke-card:active{transform:scale(.985)}
.poke-card::before{
  content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 6px);
  opacity:.6;mix-blend-mode:overlay;
}
.poke-inner{position:relative;background:var(--surface);border-radius:15px;padding:14px;display:flex;flex-direction:column;gap:10px;z-index:1}
.poke-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.poke-name{font-size:15px;font-weight:800;letter-spacing:.3px;line-height:1.2;cursor:pointer;border-bottom:1px dashed transparent}
.poke-name:active{border-bottom-color:var(--border)}
.poke-hp{font-size:11px;font-weight:800;color:var(--c2,#A78BFA);font-family:'JetBrains Mono',monospace;text-align:right;line-height:1.1}
.poke-hp .hp-num{font-size:14px;color:var(--text)}
.poke-portrait{
  height:96px;border-radius:12px;
  background:linear-gradient(135deg,var(--c1,#3B82F6) 0%,var(--c2,#A78BFA) 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:54px;line-height:1;
  border:1px solid rgba(255,255,255,.08);
  position:relative;overflow:hidden;cursor:pointer;
}
.poke-portrait::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 50%);
}
.poke-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.poke-stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.poke-stat-lbl{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-weight:600}
.poke-stat-val{font-size:14px;font-weight:800;font-family:'JetBrains Mono',monospace;margin-top:2px}
.poke-breakdown{display:flex;flex-wrap:wrap;gap:5px}
.poke-chip{font-size:10px;padding:3px 8px;border-radius:8px;background:var(--surface2);color:var(--muted);font-weight:700;border:1px solid var(--border)}
.poke-chip b{color:var(--text);font-family:'JetBrains Mono',monospace;margin-left:4px}
.poke-foot{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;border-top:1px dashed var(--border);padding-top:8px}
.poke-edition{font-family:'JetBrains Mono',monospace}
.poke-del{background:none;border:none;color:var(--muted);font-size:12px;padding:0;cursor:pointer}
.poke-del:active{color:var(--warn)}
.poke-add{
  border:1.5px dashed var(--border);border-radius:18px;display:flex;align-items:center;justify-content:center;
  min-height:280px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;background:transparent;font-family:inherit
}
.poke-add:active{color:var(--accent);border-color:var(--accent)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;display:none;align-items:flex-end;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:24px 24px 0 0;padding:22px 20px 36px;width:100%;animation:slideUp .25s ease;max-height:88vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:16px;font-weight:700;margin-bottom:6px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.modal-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:14px 16px;border-radius:14px;font-family:inherit;font-size:15px;font-weight:600;outline:none;margin-bottom:10px}
.modal-input.num{font-family:'JetBrains Mono',monospace;text-align:center;font-size:20px}
.modal-input:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:10px;margin-top:8px}
.modal-save{flex:1;background:var(--accent);color:#070B14;border:none;padding:14px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.modal-cancel{background:var(--surface2);color:var(--muted);border:none;padding:14px 20px;border-radius:14px;font-size:15px;cursor:pointer;font-family:inherit}
.modal-section-title{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin:14px 0 8px;font-weight:600}

/* INVESTOR PICKER */
.inv-pick-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto}
.inv-pick-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);cursor:pointer}
.inv-pick-row.active{border-color:var(--accent)}
.inv-pick-emoji{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.inv-pick-name{flex:1;font-size:14px;font-weight:600}
.inv-pick-stats{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}

/* COLOR / EMOJI CHOOSER */
.color-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:8px}
.color-swatch{aspect-ratio:1/1;border-radius:8px;border:2px solid transparent;cursor:pointer}
.color-swatch.selected{border-color:var(--text);transform:scale(1.05)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:8px}
.emoji-pick{aspect-ratio:1/1;border-radius:8px;background:var(--surface2);border:2px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px}
.emoji-pick.selected{border-color:var(--accent)}

/* TOAST */
.toast{position:fixed;top:30px;left:50%;transform:translateX(-50%);background:var(--accent);color:#070B14;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* TABS bottom */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:10px 16px 18px;gap:8px;z-index:50}
.nav-btn{flex:1;padding:10px;border:none;border-radius:12px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;color:var(--muted)}
.nav-btn.active{background:rgba(0,229,160,.12);color:var(--accent)}
.nav-icon{font-size:16px}

.empty-state{text-align:center;padding:30px 20px;color:var(--muted);font-size:13px}
.empty-state-emoji{font-size:36px;margin-bottom:8px;display:block}

@media (min-width:720px){
  .investor-grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  body{padding-bottom:24px}
  .bottom-nav{position:sticky;bottom:0;border-radius:16px 16px 0 0;margin:20px 20px 0;padding:10px 16px}
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- HEADER -->
<header class="header">
  <div class="header-top">
    <div class="project-block">
      <div class="project-label">Project</div>
      <div class="project-name" id="projectName" onclick="editProject()">—</div>
    </div>
    <div class="total-pill">
      <div class="total-label">Total contract</div>
      <div class="total-val mono" id="projectTotal">—</div>
    </div>
  </div>
</header>

<!-- TAB SWITCHER -->
<nav class="cluster-tabs" id="clusterTabs"></nav>

<!-- VIEW: CLUSTERS -->
<main id="viewCluster" class="section">
  <div class="cluster-stats">
    <div class="stat">
      <div class="stat-label">Villas</div>
      <div class="stat-val" id="clVillas">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Avg price</div>
      <div class="stat-val gold mono" id="clAvg">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Contract</div>
      <div class="stat-val accent mono" id="clTotal">—</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <span id="clHeading">Villas</span>
      <button class="del-btn" onclick="deleteCluster()" title="Delete cluster">🗑</button>
    </div>
    <div id="villaList"></div>
    <div class="add-row">
      <button class="add-toggle" onclick="toggleAddVilla()" id="addVillaToggle">＋ Add villa</button>
      <div class="add-form" id="addVillaForm" style="display:none;margin-top:8px">
        <input class="add-input" id="newVillaName" placeholder="Villa name (e.g. Lagoon 45)"/>
        <div class="add-row-inline">
          <input class="add-input mono" id="newVillaPrice" inputmode="numeric" placeholder="Price"/>
          <button class="add-submit" onclick="addVilla()">Add</button>
          <button class="add-cancel" onclick="toggleAddVilla()">✕</button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- VIEW: INVESTORS -->
<main id="viewInvestors" class="section" style="display:none">
  <div class="cluster-stats">
    <div class="stat">
      <div class="stat-label">Investors</div>
      <div class="stat-val" id="invCount">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Owned villas</div>
      <div class="stat-val gold" id="invVillas">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Committed</div>
      <div class="stat-val accent mono" id="invCommitted">—</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><span>Investor cards</span></div>
    <div class="investor-grid" id="investorGrid"></div>
  </div>
</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="tabCluster" onclick="setView('cluster')"><span class="nav-icon">🏘️</span>Clusters</button>
  <button class="nav-btn" id="tabInvestors" onclick="setView('investors')"><span class="nav-icon">🃏</span>Investors</button>
</nav>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target.id==='modalOverlay')closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
/* ---------- STATE ---------- */
const STORAGE_KEY = 'cf_pilot_v1';
const COLORS = ['#3B82F6','#00E5A0','#FBBF24','#F472B6','#A78BFA','#22D3EE','#F87171','#34D399','#FB923C','#818CF8','#EC4899','#10B981','#F59E0B','#06B6D4','#6366F1','#84CC16'];
const EMOJIS = ['🦊','🐉','🦁','🐯','🐺','🦅','🐻','🐼','🦄','🐲','⚡','🔥','🌊','🌟','💎','👑','🎯','🚀','🦈','🦉'];
const fmt = n => '$'+(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:0});

const seed = () => ({
  project:{name:'Riviera Pilot'},
  view:'cluster',
  activeCluster:'greek-water',
  clusters:[
    {id:'greek-water',name:'Greek Water',villas:[
      {id:'v1',name:'Lagoon 45',price:1450000,investorId:'inv1'},
      {id:'v2',name:'Aegean 12',price:1280000,investorId:'inv1'},
      {id:'v3',name:'Mykonos 7',price:1620000,investorId:'inv2'},
      {id:'v4',name:'Santorini 3',price:1750000,investorId:'inv2'},
      {id:'v5',name:'Cyclades 18',price:1380000,investorId:'inv3'},
    ]},
    {id:'soho',name:'Soho',villas:[
      {id:'v6',name:'Loft 1A',price:980000,investorId:'inv1'},
      {id:'v7',name:'Loft 2B',price:1120000,investorId:'inv3'},
      {id:'v8',name:'Penthouse 5',price:2250000,investorId:'inv4'},
      {id:'v9',name:'Studio 9',price:740000,investorId:null},
    ]},
  ],
  investors:[
    {id:'inv1',name:'Aria Holdings',color:'#3B82F6',color2:'#A78BFA',emoji:'🐉'},
    {id:'inv2',name:'Helios Capital',color:'#FBBF24',color2:'#FB923C',emoji:'🦅'},
    {id:'inv3',name:'Nova Trust',color:'#00E5A0',color2:'#22D3EE',emoji:'🦊'},
    {id:'inv4',name:'Onyx Family Office',color:'#F472B6',color2:'#A78BFA',emoji:'👑'},
  ]
});

let state = (()=>{
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return seed();
})();

const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
const uid = () => Math.random().toString(36).slice(2,9);
const cluster = () => state.clusters.find(c=>c.id===state.activeCluster) || state.clusters[0];
const investor = id => state.investors.find(i=>i.id===id);
const investorVillas = id => state.clusters.flatMap(c=>c.villas.filter(v=>v.investorId===id).map(v=>({...v,clusterName:c.name,clusterId:c.id})));
const projectTotal = () => state.clusters.reduce((s,c)=>s+c.villas.reduce((ss,v)=>ss+(+v.price||0),0),0);
const clusterTotal = c => c.villas.reduce((s,v)=>s+(+v.price||0),0);

/* ---------- TOAST ---------- */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1400)}

/* ---------- RENDER ---------- */
function render(){
  // header
  document.getElementById('projectName').textContent = state.project.name;
  document.getElementById('projectTotal').textContent = fmt(projectTotal());

  // cluster tabs
  if(!cluster()) state.activeCluster = state.clusters[0]?.id;
  const tabs = document.getElementById('clusterTabs');
  tabs.innerHTML = state.clusters.map(c=>`
    <button class="cl-tab ${c.id===state.activeCluster?'active':''}" onclick="setCluster('${c.id}')">
      <span>${escapeHtml(c.name)}</span>
      <span class="cl-count">${c.villas.length}</span>
    </button>
  `).join('') + `<button class="cl-tab add" onclick="addCluster()">＋ Cluster</button>`;

  // views
  document.getElementById('viewCluster').style.display = state.view==='cluster'?'':'none';
  document.getElementById('viewInvestors').style.display = state.view==='investors'?'':'none';
  document.getElementById('tabCluster').classList.toggle('active', state.view==='cluster');
  document.getElementById('tabInvestors').classList.toggle('active', state.view==='investors');

  if(state.view==='cluster') renderCluster();
  else renderInvestors();
}

function renderCluster(){
  const c = cluster();
  if(!c){
    document.getElementById('clHeading').textContent = 'No clusters';
    document.getElementById('villaList').innerHTML = `<div class="empty-state"><span class="empty-state-emoji">🏝️</span>Add a cluster to begin.</div>`;
    document.getElementById('clVillas').textContent='0';
    document.getElementById('clAvg').textContent='—';
    document.getElementById('clTotal').textContent='—';
    return;
  }
  document.getElementById('clHeading').textContent = c.name + ' · villas';
  const total = clusterTotal(c);
  const avg = c.villas.length ? total/c.villas.length : 0;
  document.getElementById('clVillas').textContent = c.villas.length;
  document.getElementById('clAvg').textContent = c.villas.length ? fmt(avg) : '—';
  document.getElementById('clTotal').textContent = fmt(total);

  const list = document.getElementById('villaList');
  if(!c.villas.length){
    list.innerHTML = `<div class="empty-state"><span class="empty-state-emoji">🧱</span>No villas yet. Add the first one below.</div>`;
    return;
  }
  list.innerHTML = c.villas.map((v,i)=>{
    const inv = investor(v.investorId);
    const tagStyle = inv ? `background:${inv.color}22;color:${inv.color};border-color:${inv.color}55` : '';
    const tagInner = inv ? `<span>${inv.emoji}</span><span class="vit-name">${escapeHtml(inv.name)}</span>` : `+ assign investor`;
    return `
      <div class="villa-row">
        <div class="villa-num">${String(i+1).padStart(2,'0')}</div>
        <div class="villa-info">
          <span class="villa-name" onclick="editVillaName('${v.id}')">${escapeHtml(v.name)}</span>
          <button class="villa-investor-tag ${inv?'':'empty'}" style="${tagStyle}" onclick="pickInvestor('${v.id}')">${tagInner}</button>
        </div>
        <div class="villa-right">
          <span class="villa-price mono" onclick="editVillaPrice('${v.id}')">${fmt(v.price)}</span>
          <button class="del-btn" onclick="delVilla('${v.id}')">✕</button>
        </div>
      </div>`;
  }).join('');
}

function renderInvestors(){
  const grid = document.getElementById('investorGrid');
  const summaries = state.investors.map(inv=>{
    const owned = investorVillas(inv.id);
    const total = owned.reduce((s,v)=>s+(+v.price||0),0);
    return {inv,owned,total};
  });
  const ownedVillas = summaries.reduce((s,x)=>s+x.owned.length,0);
  const committed = summaries.reduce((s,x)=>s+x.total,0);
  document.getElementById('invCount').textContent = state.investors.length;
  document.getElementById('invVillas').textContent = ownedVillas;
  document.getElementById('invCommitted').textContent = fmt(committed);

  if(!state.investors.length){
    grid.innerHTML = `<button class="poke-add" onclick="addInvestor()">＋ Add first investor</button>`;
    return;
  }

  grid.innerHTML = summaries.map(({inv,owned,total})=>{
    // group owned by cluster
    const byCluster = {};
    owned.forEach(v=>{byCluster[v.clusterName] = (byCluster[v.clusterName]||0)+1});
    const chips = Object.entries(byCluster).map(([n,k])=>`<span class="poke-chip">${escapeHtml(n)}<b>${k}</b></span>`).join('') || `<span class="poke-chip">No villas yet</span>`;
    const c1 = inv.color||'#3B82F6';
    const c2 = inv.color2||inv.color||'#A78BFA';
    return `
      <div class="poke-card" style="--c1:${c1};--c2:${c2}">
        <div class="poke-inner">
          <div class="poke-head">
            <div class="poke-name" onclick="editInvestorName('${inv.id}')">${escapeHtml(inv.name)}</div>
            <div class="poke-hp"><span class="hp-num">${owned.length}</span> villas<br/>HP</div>
          </div>
          <div class="poke-portrait" onclick="editInvestorAvatar('${inv.id}')" style="background:linear-gradient(135deg,${c1} 0%,${c2} 100%)">${inv.emoji||'🦊'}</div>
          <div class="poke-stats">
            <div class="poke-stat">
              <div class="poke-stat-lbl">Villas</div>
              <div class="poke-stat-val">${owned.length}</div>
            </div>
            <div class="poke-stat">
              <div class="poke-stat-lbl">Contract</div>
              <div class="poke-stat-val">${fmt(total)}</div>
            </div>
          </div>
          <div class="poke-breakdown">${chips}</div>
          <div class="poke-foot">
            <span class="poke-edition">#${inv.id.toUpperCase().slice(0,5)} · 1ED</span>
            <button class="poke-del" onclick="event.stopPropagation();delInvestor('${inv.id}')">remove</button>
          </div>
        </div>
      </div>`;
  }).join('') + `<button class="poke-add" onclick="addInvestor()">＋ Add investor</button>`;
}

/* ---------- ACTIONS ---------- */
function setView(v){state.view=v;save();render()}
function setCluster(id){state.activeCluster=id;save();render()}

function editProject(){
  openPrompt({title:'Project name',value:state.project.name,placeholder:'Project name',onSave:v=>{
    if(!v.trim()) return;
    state.project.name = v.trim();save();render();toast('Project renamed')
  }})
}

function addCluster(){
  openPrompt({title:'New cluster',placeholder:'Cluster name (e.g. Marina Bay)',onSave:v=>{
    if(!v.trim()) return;
    const c = {id:uid(),name:v.trim(),villas:[]};
    state.clusters.push(c);
    state.activeCluster = c.id;
    save();render();toast('Cluster added')
  }})
}
function deleteCluster(){
  const c = cluster();if(!c) return;
  if(!confirm(`Delete cluster "${c.name}" and its ${c.villas.length} villas?`)) return;
  state.clusters = state.clusters.filter(x=>x.id!==c.id);
  state.activeCluster = state.clusters[0]?.id;
  save();render();toast('Cluster removed')
}

function toggleAddVilla(){
  const f = document.getElementById('addVillaForm');
  const t = document.getElementById('addVillaToggle');
  const open = f.style.display==='none';
  f.style.display = open?'flex':'none';
  t.style.display = open?'none':'block';
  if(open){document.getElementById('newVillaName').focus()}
}
function addVilla(){
  const c = cluster();if(!c){toast('Add a cluster first');return}
  const name = document.getElementById('newVillaName').value.trim();
  const price = parseFloat(String(document.getElementById('newVillaPrice').value).replace(/[^0-9.]/g,''))||0;
  if(!name){toast('Name required');return}
  c.villas.push({id:uid(),name,price,investorId:null});
  document.getElementById('newVillaName').value='';
  document.getElementById('newVillaPrice').value='';
  toggleAddVilla();
  save();render();toast('Villa added')
}
function editVillaName(id){
  const c = cluster();const v = c.villas.find(x=>x.id===id);if(!v) return;
  openPrompt({title:'Villa name',value:v.name,onSave:val=>{
    if(!val.trim()) return;
    v.name = val.trim();save();render()
  }})
}
function editVillaPrice(id){
  const c = cluster();const v = c.villas.find(x=>x.id===id);if(!v) return;
  openPrompt({title:'Villa price',value:String(v.price||0),numeric:true,onSave:val=>{
    const p = parseFloat(String(val).replace(/[^0-9.]/g,''))||0;
    v.price = p;save();render();toast('Price updated')
  }})
}
function delVilla(id){
  const c = cluster();const v = c.villas.find(x=>x.id===id);if(!v) return;
  if(!confirm(`Delete villa "${v.name}"?`)) return;
  c.villas = c.villas.filter(x=>x.id!==id);
  save();render()
}

function pickInvestor(villaId){
  const c = cluster();const v = c.villas.find(x=>x.id===villaId);if(!v) return;
  const rows = state.investors.map(inv=>{
    const owned = investorVillas(inv.id);
    return `<div class="inv-pick-row ${v.investorId===inv.id?'active':''}" onclick="assignInvestor('${villaId}','${inv.id}')">
      <div class="inv-pick-emoji" style="background:${inv.color}33;color:${inv.color}">${inv.emoji}</div>
      <div class="inv-pick-name">${escapeHtml(inv.name)}</div>
      <div class="inv-pick-stats">${owned.length}🏠 · ${fmt(owned.reduce((s,vv)=>s+(+vv.price||0),0))}</div>
    </div>`;
  }).join('');
  openModal(`
    <div class="modal-title">Assign investor</div>
    <div class="modal-sub">${escapeHtml(v.name)} · ${fmt(v.price)}</div>
    <div class="inv-pick-list">
      <div class="inv-pick-row ${!v.investorId?'active':''}" onclick="assignInvestor('${villaId}',null)">
        <div class="inv-pick-emoji" style="background:var(--surface2);color:var(--muted)">∅</div>
        <div class="inv-pick-name" style="color:var(--muted)">Unassigned</div>
      </div>
      ${rows}
    </div>
    <div class="modal-section-title">Or create new</div>
    <button class="modal-save" onclick="closeModal();addInvestor('${villaId}')">＋ New investor</button>
    <div class="modal-btns"><button class="modal-cancel" style="flex:1" onclick="closeModal()">Close</button></div>
  `)
}
function assignInvestor(villaId, invId){
  const c = cluster();const v = c.villas.find(x=>x.id===villaId);if(!v) return;
  v.investorId = invId; save(); render(); closeModal(); toast(invId?'Investor assigned':'Investor cleared')
}

function addInvestor(assignToVillaId){
  // pick a free color/emoji as defaults
  const usedColors = new Set(state.investors.map(i=>i.color));
  const usedEmojis = new Set(state.investors.map(i=>i.emoji));
  const defC = COLORS.find(c=>!usedColors.has(c)) || COLORS[0];
  const defC2 = COLORS[(COLORS.indexOf(defC)+3)%COLORS.length];
  const defE = EMOJIS.find(e=>!usedEmojis.has(e)) || EMOJIS[0];
  const inv = {id:uid(),name:'',color:defC,color2:defC2,emoji:defE};
  openInvestorEditor(inv,true,(saved)=>{
    if(!saved) return;
    state.investors.push(inv);
    if(assignToVillaId){
      const c = cluster();const v = c.villas.find(x=>x.id===assignToVillaId);
      if(v) v.investorId = inv.id;
    }
    save();render();toast('Investor created')
  })
}
function editInvestorName(id){
  const inv = investor(id); if(!inv) return;
  openInvestorEditor(inv,false,(saved)=>{ if(saved){save();render();toast('Updated')} })
}
function editInvestorAvatar(id){editInvestorName(id)}
function delInvestor(id){
  const inv = investor(id); if(!inv) return;
  const owned = investorVillas(id).length;
  const msg = owned ? `Remove "${inv.name}"? Their ${owned} villa(s) will become unassigned.` : `Remove "${inv.name}"?`;
  if(!confirm(msg)) return;
  state.clusters.forEach(c=>c.villas.forEach(v=>{if(v.investorId===id) v.investorId=null}));
  state.investors = state.investors.filter(i=>i.id!==id);
  save();render();toast('Investor removed')
}

function openInvestorEditor(inv,isNew,done){
  const colors = COLORS.map(c=>`<div class="color-swatch ${inv.color===c?'selected':''}" data-c1="${c}" style="background:${c}" onclick="_pickC1(this,'${c}')"></div>`).join('');
  const colors2 = COLORS.map(c=>`<div class="color-swatch ${inv.color2===c?'selected':''}" data-c2="${c}" style="background:${c}" onclick="_pickC2(this,'${c}')"></div>`).join('');
  const emojis = EMOJIS.map(e=>`<div class="emoji-pick ${inv.emoji===e?'selected':''}" data-e="${e}" onclick="_pickE(this,'${e}')">${e}</div>`).join('');
  openModal(`
    <div class="modal-title">${isNew?'New investor':'Edit investor'}</div>
    <div class="modal-sub">Pokémon-style card setup</div>
    <input class="modal-input" id="invName" placeholder="Investor name" value="${escapeAttr(inv.name)}"/>
    <div class="modal-section-title">Avatar</div>
    <div class="emoji-grid" id="emojiGrid">${emojis}</div>
    <div class="modal-section-title">Primary colour</div>
    <div class="color-grid" id="colorGrid">${colors}</div>
    <div class="modal-section-title">Secondary colour (gradient)</div>
    <div class="color-grid" id="colorGrid2">${colors2}</div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal();_invDone&&_invDone(false)">Cancel</button>
      <button class="modal-save" onclick="_saveInv()">Save</button>
    </div>
  `);
  window._editingInv = inv;
  window._invDone = done;
  setTimeout(()=>document.getElementById('invName').focus(),50);
}
function _pickC1(el,c){document.querySelectorAll('#colorGrid .color-swatch').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');window._editingInv.color=c}
function _pickC2(el,c){document.querySelectorAll('#colorGrid2 .color-swatch').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');window._editingInv.color2=c}
function _pickE(el,e){document.querySelectorAll('#emojiGrid .emoji-pick').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');window._editingInv.emoji=e}
function _saveInv(){
  const name = document.getElementById('invName').value.trim();
  if(!name){toast('Name required');return}
  window._editingInv.name = name;
  closeModal();
  if(window._invDone) window._invDone(true);
}

/* ---------- GENERIC PROMPT MODAL ---------- */
function openPrompt({title,sub,value,placeholder,numeric,onSave}){
  openModal(`
    <div class="modal-title">${escapeHtml(title||'Edit')}</div>
    ${sub?`<div class="modal-sub">${escapeHtml(sub)}</div>`:''}
    <input id="promptInput" class="modal-input ${numeric?'num':''}" placeholder="${escapeAttr(placeholder||'')}" value="${escapeAttr(value||'')}" ${numeric?'inputmode="decimal"':''}/>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-save" onclick="_promptSave()">Save</button>
    </div>
  `);
  setTimeout(()=>{const i=document.getElementById('promptInput');i.focus();i.select()},50);
  window._promptOnSave = onSave;
  document.getElementById('promptInput').addEventListener('keydown',e=>{if(e.key==='Enter') _promptSave()});
}
function _promptSave(){
  const v = document.getElementById('promptInput').value;
  const fn = window._promptOnSave;
  closeModal();
  fn && fn(v);
}

/* ---------- MODAL HELPERS ---------- */
function openModal(html){
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
}

/* ---------- HELPERS ---------- */
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escapeAttr(s){return escapeHtml(s)}

/* ---------- INIT ---------- */
render();
</script>
</body>
</html>
